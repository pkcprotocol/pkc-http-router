# build, test and publish the docker image to ghcr.io on every github release,
# so images are never built or pushed by hand
name: Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.0.4)'
        required: true

jobs:
  docker-test:
    name: Build and test Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Resolve release tag
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # build for the local platform only (amd64) and load into docker for testing
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pkc-http-router:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the router with docker compose
        env:
          PKC_HTTP_ROUTER_IMAGE: pkc-http-router:test
          HTTP_PORT: 8099
          HTTP_BIND_IP: 127.0.0.1
          # so the announced multiaddr below is not cleaned against the request ip
          NO_IP_VALIDATE: 1
        run: docker compose up -d

      - name: Wait for the container to report healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' pkc-http-router 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "healthy after ${i}s"
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "container went unhealthy"
              docker compose logs --no-color
              exit 1
            fi
            sleep 1
          done
          echo "container did not become healthy within 60s"
          docker compose logs --no-color
          exit 1

      - name: Check the welcome route
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/)
          if [ "$code" != "200" ]; then
            echo "FAIL: GET / returned $code, expected 200"
            exit 1
          fi
          echo "GET / returned 200"

      - name: Announce a provider and read it back
        run: |
          CID=QmYwAPJzv5CZsnA625s3Xf2nemtYgPpHdWEz79ojWnPbdG
          # throwaway ed25519 key generated for this smoke test, its peer id is the
          # base58btc identity multihash of the matching libp2p public key protobuf
          PEER=12D3KooWQwhnVwLvzdNAEQ3Wec19PBXm6wAdr65oMsF7PA7oq6Xm
          PRIVATE_KEY=MC4CAQAwBQYDK2VwBCIEIFa7f3E/4jvhbzBO+08V3cuWe780+qGXtIIpLgS8d9oD

          # records must carry a valid ipip-0526 signature over the payload bytes as sent,
          # so sign them here instead of hardcoding a body
          BODY=$(CID="$CID" PEER="$PEER" PRIVATE_KEY="$PRIVATE_KEY" node -e '
            const crypto = require("node:crypto")
            const payload = JSON.stringify({
              Keys: [process.env.CID],
              Timestamp: Date.now(),
              AdvisoryTTL: 86400000000000,
              ID: process.env.PEER,
              Addrs: ["/ip4/1.2.3.4/tcp/4001"]
            })
            const privateKey = crypto.createPrivateKey({key: Buffer.from(process.env.PRIVATE_KEY, "base64"), format: "der", type: "pkcs8"})
            const digest = crypto.createHash("sha256").update(Buffer.from(payload, "utf8")).digest()
            const signature = "m" + crypto.sign(null, digest, privateKey).toString("base64").replace(/=+$/, "")
            process.stdout.write(`{"Providers":[{"Schema":"bitswap","Protocol":"transport-bitswap","Signature":"${signature}","Payload":${payload}}]}`)
          ')

          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            http://127.0.0.1:8099/routing/v1/providers/ \
            -H 'content-type: application/json' \
            -d "$BODY")
          if [ "$code" != "200" ]; then
            echo "FAIL: PUT /routing/v1/providers/ returned $code, expected 200"
            exit 1
          fi

          body=$(curl -s "http://127.0.0.1:8099/routing/v1/providers/$CID")
          echo "$body"
          if ! echo "$body" | grep -q "$PEER"; then
            echo "FAIL: the announced peer was not returned"
            exit 1
          fi
          echo "provider roundtrip ok"

          # the same record with its signature stripped must be refused
          UNSIGNED=$(echo "$BODY" | node -e '
            let raw = ""
            process.stdin.on("data", (chunk) => {raw += chunk})
            process.stdin.on("end", () => {
              const body = JSON.parse(raw)
              delete body.Providers[0].Signature
              process.stdout.write(JSON.stringify(body))
            })
          ')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            http://127.0.0.1:8099/routing/v1/providers/ \
            -H 'content-type: application/json' \
            -d "$UNSIGNED")
          if [ "$code" != "403" ]; then
            echo "FAIL: unsigned PUT /routing/v1/providers/ returned $code, expected 403"
            exit 1
          fi
          echo "unsigned announce refused"

      - name: Check the database was written to the mounted volume
        run: |
          if [ ! -f data/database.sqlite ]; then
            echo "FAIL: data/database.sqlite was not created on the host"
            ls -la data || true
            exit 1
          fi
          echo "data/database.sqlite exists"

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop and remove docker compose services
        if: always()
        run: docker compose down -v

  docker-push:
    name: Push Docker image
    needs:
      - docker-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve release tag
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.tag }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pkcprotocol/pkc-http-router
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ref.outputs.tag }}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # full multi-arch build and push
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
