# bump version, update changelog and create a github release, but only after all CI tests pass
name: CI build

on:
  workflow_run:
    workflows:
      - 'CI'
    types:
      - 'completed'

jobs:
  on-success:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # to dispatch the docker publish workflow below
      actions: write
    # head_branch alone is not enough: a pull_request CI run from a fork's master branch also reports
    # head_branch == 'master', and that run would release this repository's master. Release only
    # after a push to this repository's master.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'master'
        && github.event.workflow_run.head_repository.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Set up Git author
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Get version before release
        id: before
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Run release-it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --ci

      - name: Get version after release
        id: after
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # release-it creates the github release with GITHUB_TOKEN, and events triggered by
      # that token do not start other workflows, so "on: release" would never fire.
      # workflow_dispatch is the documented exception, so kick the image build off here.
      - name: Trigger the docker image build and publish
        if: ${{ steps.before.outputs.version != steps.after.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker-publish.yml -f tag=v${{ steps.after.outputs.version }}
